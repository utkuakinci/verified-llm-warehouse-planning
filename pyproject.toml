[project]
name = "verified-llm-warehouse-planning"
version = "0.1.0"
description = "An LLM writes PDDL plans for warehouse robots, a classical validator checks them, and the errors drive a repair loop."
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "accelerate>=1.0",
    "anthropic>=0.40",
    "bitsandbytes>=0.45",
    "datasets>=3.0",
    "matplotlib>=3.9",
    "msvc-runtime>=14.40; sys_platform == 'win32'",
    "numpy>=2.0",
    "peft>=0.14",
    "pillow>=10.0",
    "torch>=2.5",
    "transformers>=5.0",
    "unified-planning==1.3.0",
    "up-fast-downward==1.0.0",
]

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["warehouse_planning"]

[tool.uv.sources]
torch = { index = "pytorch-cu126" }

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[tool.pytest.ini_options]
testpaths = ["tests"]
